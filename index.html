<html>

<head>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script>
        var count = 0, coords;
        AFRAME.registerComponent('flying', {
            init: function () {
                coords = document.getElementById('cam');
                document.querySelector('a-scene').addEventListener('enter-vr', function () {
                    coords = document.getElementById('rig');
                });
                document.querySelector('a-scene').addEventListener('exit-vr', function () {
                    coords = document.getElementById('cam');
                });
            },
            tick: function () {
                var pos1 = coords.getAttribute('position');
                var pos2 = this.el.getAttribute('position');
                if (Math.abs(pos1.x - pos2.x) < 1 && Math.abs(pos1.z - pos2.z) < 1) {
                    this.el.remove();
                    document.getElementById('counter').setAttribute('value', 'Score: ' + ++count);

                    // Παίζει ο ήχος πόντου
                    var sound = document.getElementById('catch-sound');
                    if (sound && sound.components.sound) {
                        sound.components.sound.playSound();
                    }
                }
                if (Math.random() < 0.95) return;
                var x = Math.random() * 600 - 300;
                var z = Math.random() * 600 - 300;
                this.el.setAttribute('animation', 'property: position; to: ' + x + ' 2.5 ' + z + '; dur: 10000');
            }
        });
    </script>
    <script src="https://gftruj.github.io/webzamples/aframe/controls/oculus-thumbstick-controls.js"></script>
</head>

<body>
    <a-scene id="s1" background="color:#0d0928" fog="far:300" shadow="type: pcfsoft">

        <a-entity id="rig">
            <a-camera id="cam" position="0 3 0">
                <a-text id="counter" value="Score: 0"
                        geometry="primitive: plane; width: 0; height: 1"
                        position="-0.5 0.5 -1"
                        material="opacity: 0"></a-text>
            </a-camera>
            <a-entity oculus-touch-controls="hand: right" oculus-thumbstick-controls></a-entity>
        </a-entity>

        <a-sphere radius="500" position="0 5000 0" material="fog: false"></a-sphere>

        <a-entity light="type: directional; intensity: 0.5; castShadow: true;
                         shadowCameraBottom: -500; shadowCameraTop: 500;
                         shadowCameraLeft: -500; shadowCameraRight: 500"
                  position="0 250 0"></a-entity>
        <a-light type="ambient" intensity="0.25"></a-light>

        <a-assets>
            <a-asset-item id="tree" src="low_poly_tree.glb"></a-asset-item>
            <a-asset-item id="butterfly" src="animated_butterfly.glb"></a-asset-item>
            <a-asset-item id="net" src="jellyfish_net_spongebob.glb"></a-asset-item>
            <audio id="catch" src="ding-402325.mp3"></audio
